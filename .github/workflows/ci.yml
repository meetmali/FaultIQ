name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: faultiq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: faultiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faultiq -d faultiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAULTIQ_TEST_DB: "Host=localhost;Database=faultiq_test;Username=faultiq;Password=ci-only"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: api/global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      # The SQL script reviewers and the worker's contract test use must match the migrations.
      - run: dotnet tool restore
      - run: dotnet ef migrations script --idempotent --no-build --configuration Release --project src/FaultIQ.Api -o /tmp/schema.sql
      - run: diff migrations/schema.sql /tmp/schema.sql

  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: faultiq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: faultiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faultiq -d faultiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FAULTIQ_TEST_DATABASE_URL: "postgresql+psycopg://faultiq:ci-only@localhost:5432/faultiq_test"
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Generated API types must match the committed contracts (ADR 0008).
      - run: npm run generate:api && git diff --exit-code src/types/generated
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # End-to-end journeys against the built app, with recorded API responses (ADR 0025).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  # Docker isn't required on contributors' machines, so CI checks that every image still builds.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: api, target: "" }
          - { name: worker, context: pipeline, target: "" }
          - { name: web, context: frontend, target: web }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Validate compose files
        if: matrix.name == 'web'
        run: |
          docker compose --env-file .env.example config --quiet
          POSTGRES_PASSWORD=ci docker compose -f compose.prod.yml --env-file .env.prod.example config --quiet
